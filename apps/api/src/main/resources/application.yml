server:
  port: ${PORT:8080}

spring:
  application:
    name: personal-platform-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/personal_platform}
    username: ${SPRING_DATASOURCE_USERNAME:personal}
    password: ${SPRING_DATASOURCE_PASSWORD:personal}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origin: ${WEB_ORIGIN:http://localhost:3000}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
